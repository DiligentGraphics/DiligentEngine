name: Android build

on: [push, pull_request]

env:
  ANDROID_NDK_VERSION: 30.0.16248370

jobs:
  build:
    runs-on: ubuntu-26.04

    strategy:
      matrix:
        include:
          - name: "ARM32"
            arch: "armeabi-v7a"

          - name: "ARM64"
            arch: "arm64-v8a"

    name: Linux -> Android-${{ matrix.name }}

    steps:
    - name: Clean Disk
      uses: DiligentGraphics/github-action/clean-disk-ubuntu@v37
      with:
        preserve-android-ndk: ${{env.ANDROID_NDK_VERSION}}

    - name: Clone repository
      uses: actions/checkout@v6
      with:
        submodules: recursive

    - name: Set up build environment
      if:   success()
      uses: DiligentGraphics/github-action/setup-build-env@v37
      with:
        platform: Android

    - name: Set up Java binding generation
      uses: DiligentGraphics/github-action/setup-java-bindings@v37
      with:
        java-home: ${{env.JAVA_HOME}}

    - name: Build with Gradle
      if:   success()
      env:
        ANDROID_ARCH: ${{ matrix.arch }}
      run: |
        cd $GITHUB_WORKSPACE/DiligentSamples/Android
        chmod +x gradlew
        ./gradlew buildRelease \
          "-PcmakeVersion=$(cmake --version | head -n1 | awk '{print $3}')" \
          -Pcmake.DILIGENT_NO_FORMAT_VALIDATION=ON \
          -Pcmake.RADIENT_BUILD_JAVA_BINDINGS=ON \
          "-Pcmake.RADIENT_BINDINGS_PYTHON_EXECUTABLE=$RADIENT_BINDINGS_PYTHON_EXECUTABLE" \
          "-Pcmake.RADIENT_BINDINGS_LIBCLANG=$RADIENT_BINDINGS_LIBCLANG"
        # Gradle builds the shared libraries. Compile the Java classes in that
        # same build tree; do not configure another native build.
        mapfile -t caches < <(find "$GITHUB_WORKSPACE/build/Android/.cxx/RelWithDebInfo" \
          -path "*/$ANDROID_ARCH/CMakeCache.txt")
        if [[ ${#caches[@]} != 1 ]]; then
          echo "Expected one Gradle CMake build for $ANDROID_ARCH, found ${#caches[@]}"
          exit 1
        fi
        cmake --build "$(dirname "${caches[0]}")" \
          --target RadientJNI Radient-JavaClasses --parallel "$(nproc)"
        echo -e "\nRemaining disk space: $(df -BG / | awk 'NR==2 {print $4}' | sed 's/G//') GB"

  test:
    name: Linux -> Android-x86_64, Debug tests
    runs-on: ubuntu-26.04
    steps:
    - name: Clone repository
      uses: actions/checkout@v6
      with:
        submodules: recursive

    - name: Set up build environment
      uses: DiligentGraphics/github-action/setup-build-env@v37
      with:
        platform: Android

    - name: Set up Java binding generation
      uses: DiligentGraphics/github-action/setup-java-bindings@v37
      with:
        java-home: ${{env.JAVA_HOME}}

    - name: Configure CMake
      uses: DiligentGraphics/github-action/configure-cmake@v37
      with:
        generator: Ninja
        build-type: Debug
        cmake-args: >-
          -DCMAKE_TOOLCHAIN_FILE="${{env.ANDROID_HOME}}/ndk/${{env.ANDROID_NDK_VERSION}}/build/cmake/android.toolchain.cmake"
          -DANDROID_ABI=x86_64 -DANDROID_PLATFORM=android-28 -DANDROID_STL=c++_static
          -DDILIGENT_BUILD_SAMPLES=OFF -DDILIGENT_BUILD_FX_TESTS=ON
          -DDILIGENT_BUILD_GOOGLE_TEST=OFF
          ${{env.RADIENT_JAVA_CMAKE_ARGS}}

    - name: Build
      uses: DiligentGraphics/github-action/build@v37
      with:
        target: RadientTest RadientJNI Radient-JavaClasses

    - name: Test Android runner and binding model
      run: |
        ctest --test-dir "$DILIGENT_BUILD_DIR/DiligentFX/Tests/RadientTest/android" --output-on-failure
        ctest --test-dir "$DILIGENT_BUILD_DIR/DiligentFX/Radient/bindings" -L Model --output-on-failure

    - name: Test Radient on Android
      uses: DiligentGraphics/github-action/run-radient-android-tests@v37
      with:
        artifact-name: RadientAndroid-x86_64-Debug
